name: Publish desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify tag matches application version
        shell: pwsh
        run: |
          $expected = "v" + (python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Release tag $env:GITHUB_REF_NAME does not match $expected from pyproject.toml."
          }
      - name: Build and verify Windows package
        shell: pwsh
        run: ./scripts/build_release.ps1
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/*-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  build-macos:
    runs-on: macos-14
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify tag matches application version
        run: |
          expected="v$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match $expected from pyproject.toml." >&2
            exit 1
          fi
      - name: Validate optional Apple signing credentials
        run: |
          configured=0
          for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD MACOS_SIGNING_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            if [[ -n "${!name}" ]]; then
              configured=$((configured + 1))
            fi
          done
          if [[ "$configured" -ne 0 && "$configured" -ne 6 ]]; then
            echo "Configure all six Apple signing secrets, or leave all six unset." >&2
            exit 1
          fi
          if [[ "$configured" -eq 0 ]]; then
            echo "Apple credentials are not configured; publishing an unsigned macOS test build."
          fi
      - name: Import Apple signing certificate
        if: ${{ env.MACOS_SIGNING_IDENTITY != '' }}
        env:
          CERTIFICATE_PATH: ${{ runner.temp }}/developer-id.p12
          KEYCHAIN_PATH: ${{ runner.temp }}/app-signing.keychain-db
        run: |
          python -c 'import base64, os, pathlib; pathlib.Path(os.environ["CERTIFICATE_PATH"]).write_bytes(base64.b64decode(os.environ["MACOS_CERTIFICATE_P12"]))'
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$keychain_password" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          xcrun notarytool store-credentials "icu-patient-tracker-notary" \
            --keychain "$KEYCHAIN_PATH" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD"
          echo "MACOS_NOTARY_PROFILE=icu-patient-tracker-notary" >> "$GITHUB_ENV"
          echo "MACOS_NOTARY_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
      - name: Build and verify macOS package
        run: bash scripts/build_macos.sh
      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            dist/*-macos-arm64.dmg
            dist/SHA256SUMS-macos-arm64.txt
            dist/macos-signing-status.txt
          if-no-files-found: error

  publish:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified packages
        uses: actions/download-artifact@v4
        with:
          pattern: "*-release"
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## Downloads

          - **Windows:** download the `windows-x64.zip`, extract the complete folder, and run `ICU Patient Tracker.exe`.
          - **Apple Silicon Mac:** download the `macos-arm64.dmg`, open it, and drag the app to Applications.

          ## macOS security notice

          The Mac installation guide linked below includes checksum verification and the **System Settings > Privacy & Security > Open Anyway** procedure for a verified unsigned download.

          ## Mac improvements

          - Smaller, draggable patient sidebar with remembered width.
          - Compact Dx editor alongside Devices/Lines, sharing the full diagnostic text.
          - Skip optional device size, location, and placement date with Enter.
          - Default daytime ICU resident is #INPUT#; configured names remain supported.

          ## Synchronization upgrade

          Update both Mac and Windows to 0.1.5 before syncing these records. Windows includes data compatibility without changing its chart layout or device-entry requirements. The sync server must accept snapshot version 4; see the Supabase setup guide.

          This release contains no patient database or patient records. Each installation creates a new empty local database.
          EOF
          printf '\n[Step-by-step Mac installation and quick start](https://github.com/%s/blob/%s/docs/MacQuickStart.md)\n' "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> release-notes.md
          printf '\n## Mac signing status\n\n' >> release-notes.md
          cat release-assets/macos-signing-status.txt >> release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "ICU Patient Tracker $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --prerelease \
            --verify-tag
