name: Build macOS release

on:
  workflow_dispatch:

jobs:
  build-apple-silicon:
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build and verify unsigned DMG
        run: bash scripts/build_macos.sh
      - name: Upload DMG and checksum
        uses: actions/upload-artifact@v4
        with:
          name: icu-patient-tracker-macos-apple-silicon
          path: |
            dist/*-macos-arm64.dmg
            dist/SHA256SUMS-macos-arm64.txt
          if-no-files-found: error
