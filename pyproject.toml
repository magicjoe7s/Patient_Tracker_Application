[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "icu-patient-tracker"
version = "0.1.2"
description = "Desktop workspace for veterinary ICU patient tracking"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "PySide6>=6.8",
    "SQLAlchemy>=2.0",
    "keyring>=25.6; sys_platform == 'darwin'",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.15",
    "pytest>=8.0",
    "ruff>=0.9",
]
release = [
    "pyinstaller>=6.15",
]

[project.scripts]
icu-patient-tracker = "icu_patient_tracker.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"icu_patient_tracker.resources" = ["themes/*.qss", "icons/*.ico", "icons/*.png"]
"icu_patient_tracker.persistence.migrations" = ["script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -p no:cacheprovider"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/icu_patient_tracker"]
